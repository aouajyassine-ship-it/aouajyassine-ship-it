<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="56" viewBox="0 0 1200 56" role="img" aria-labelledby="title desc">
  <title id="title">Decorative divider</title>
  <desc id="desc">A thin crimson line with a pulsing diamond at its center.</desc>

  <defs>
    <linearGradient id="leftLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#991b1b" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="rightLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc2626" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#991b1b" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <style><![CDATA[
      .pulse { animation: pulse 4.5s ease-in-out infinite; }
      .glint { animation: glint 9s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      @keyframes glint {
        0%, 100% { transform: translateX(0); opacity: 0; }
        35% { opacity: 0.7; }
        50% { transform: translateX(300px); opacity: 0.9; }
        65% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse, .glint { animation: none; }
      }
    ]]></style>
  </defs>

  <line x1="120" y1="28" x2="566" y2="28" stroke="url(#leftLine)" stroke-width="2"/>
  <line x1="634" y1="28" x2="1080" y2="28" stroke="url(#rightLine)" stroke-width="2"/>
  <circle cx="600" cy="28" r="11" fill="#dc2626" opacity="0.16" filter="url(#glow)" class="pulse"/>
  <rect x="592" y="20" width="16" height="16" transform="rotate(45 600 28)" fill="none" stroke="#dc2626" stroke-width="1.4" class="pulse"/>
  <circle cx="600" cy="28" r="2.4" fill="#dc2626" class="pulse"/>
  <circle cx="120" cy="28" r="1.6" fill="#991b1b" opacity="0.8"/>
  <circle cx="1080" cy="28" r="1.6" fill="#991b1b" opacity="0.8"/>
  <circle cx="330" cy="28" r="1.3" fill="#fca5a5" opacity="0.7" class="glint"/>
</svg>
