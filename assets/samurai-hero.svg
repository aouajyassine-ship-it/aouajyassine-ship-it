<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Lone samurai beneath a crimson moon</title>
  <desc id="desc">An original dark anime illustration: a samurai stands on a ridge beneath a large red moon, with a torii gate, a distant pagoda, drifting sakura petals and rising embers.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080808"/>
      <stop offset="0.5" stop-color="#0b0909"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>

    <radialGradient id="moon" cx="0.4" cy="0.34" r="0.76">
      <stop offset="0" stop-color="#fca5a5"/>
      <stop offset="0.22" stop-color="#ef4444"/>
      <stop offset="0.52" stop-color="#dc2626"/>
      <stop offset="0.82" stop-color="#991b1b"/>
      <stop offset="1" stop-color="#6b1414"/>
    </radialGradient>

    <radialGradient id="moonShade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.6" stop-color="#450a0a" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#450a0a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2b0606" stop-opacity="0.5"/>
    </radialGradient>

    <radialGradient id="moonHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0.4"/>
      <stop offset="0.42" stop-color="#991b1b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#991b1b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="mist" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0.13"/>
      <stop offset="0.5" stop-color="#7f1d1d" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.72">
      <stop offset="0.5" stop-color="#080808" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#080808" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0.92"/>
    </radialGradient>

    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#dc2626" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#991b1b" stop-opacity="0"/>
      <stop offset="1" stop-color="#991b1b" stop-opacity="0.14"/>
    </linearGradient>

    <filter id="blurLg" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="blurSm" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="blurXs" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>

    <clipPath id="moonClip">
      <circle cx="966" cy="156" r="108"/>
    </clipPath>

    <style><![CDATA[
      .breathe { animation: breathe 7s ease-in-out infinite; transform-origin: 966px 156px; }
      .star { animation: twinkle 5.5s ease-in-out infinite; }
      .s2 { animation-delay: -1.4s; }
      .s3 { animation-delay: -2.8s; }
      .s4 { animation-delay: -3.9s; }
      .petal { transform-box: fill-box; transform-origin: center; }
      .p1 { animation: fall 14s linear infinite; }
      .p2 { animation: fall 19s linear infinite -7s; }
      .p3 { animation: fall 16s linear infinite -3s; }
      .p4 { animation: fall 22s linear infinite -12s; }
      .p5 { animation: fall 17s linear infinite -9s; }
      .p6 { animation: fall 24s linear infinite -15s; }
      .p7 { animation: fall 15s linear infinite -5s; }
      .p8 { animation: fall 20s linear infinite -11s; }
      .ember { animation: rise 12s ease-out infinite; }
      .e2 { animation-delay: -4s; animation-duration: 15s; }
      .e3 { animation-delay: -7s; animation-duration: 11s; }
      .e4 { animation-delay: -2s; animation-duration: 16s; }
      .e5 { animation-delay: -9s; animation-duration: 13s; }
      .e6 { animation-delay: -5s; animation-duration: 18s; }

      @keyframes breathe {
        0%, 100% { opacity: 0.65; }
        50% { opacity: 1; }
      }
      @keyframes twinkle {
        0%, 100% { opacity: 0.12; }
        50% { opacity: 0.6; }
      }
      @keyframes fall {
        0% { transform: translate(0, -40px) rotate(0deg); opacity: 0; }
        8% { opacity: 0.75; }
        85% { opacity: 0.55; }
        100% { transform: translate(-74px, 440px) rotate(300deg); opacity: 0; }
      }
      @keyframes rise {
        0% { transform: translate(0, 0); opacity: 0; }
        15% { opacity: 0.6; }
        75% { opacity: 0.32; }
        100% { transform: translate(-28px, -155px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .breathe, .star, .petal, .ember { animation: none; }
        .petal { opacity: 0.45; }
      }
    ]]></style>
  </defs>

  <!-- Sky -->
  <rect width="1200" height="400" fill="url(#sky)"/>
  <rect y="250" width="1200" height="150" fill="url(#horizon)"/>

  <!-- Stars -->
  <g fill="#e5e5e5">
    <circle class="star" cx="92" cy="64" r="1.1"/>
    <circle class="star s2" cx="164" cy="118" r="0.9"/>
    <circle class="star s3" cx="246" cy="52" r="1.2"/>
    <circle class="star s4" cx="338" cy="94" r="0.8"/>
    <circle class="star" cx="426" cy="38" r="1"/>
    <circle class="star s2" cx="512" cy="108" r="0.8"/>
    <circle class="star s3" cx="588" cy="58" r="1.1"/>
    <circle class="star s4" cx="684" cy="96" r="0.8"/>
    <circle class="star" cx="762" cy="44" r="1"/>
    <circle class="star s2" cx="836" cy="88" r="0.7"/>
    <circle class="star s3" cx="1108" cy="58" r="1.1"/>
    <circle class="star s4" cx="1152" cy="126" r="0.8"/>
    <circle class="star" cx="1048" cy="32" r="0.8"/>
    <circle class="star s2" cx="46" cy="146" r="0.7"/>
    <circle class="star s3" cx="300" cy="158" r="0.6"/>
    <circle class="star s4" cx="640" cy="146" r="0.6"/>
  </g>

  <!-- Moon halo -->
  <circle class="breathe" cx="966" cy="156" r="180" fill="url(#moonHalo)" filter="url(#blurLg)"/>
  <circle class="breathe" cx="966" cy="156" r="124" fill="#dc2626" opacity="0.16" filter="url(#blurSm)"/>

  <!-- Moon -->
  <g>
    <circle cx="966" cy="156" r="108" fill="url(#moon)"/>
    <g clip-path="url(#moonClip)" fill="#5f0f0f">
      <ellipse cx="930" cy="118" rx="34" ry="20" opacity="0.28" filter="url(#blurSm)"/>
      <ellipse cx="1010" cy="190" rx="46" ry="28" opacity="0.3" filter="url(#blurSm)"/>
      <ellipse cx="938" cy="208" rx="24" ry="13" opacity="0.24" filter="url(#blurSm)"/>
      <ellipse cx="1004" cy="104" rx="20" ry="12" opacity="0.2" filter="url(#blurSm)"/>
      <path d="M914 134 Q 956 118 1000 134" fill="none" stroke="#7f1d1d" stroke-opacity="0.2" stroke-width="3" filter="url(#blurXs)"/>
    </g>
    <circle cx="966" cy="156" r="108" fill="url(#moonShade)"/>
    <circle cx="966" cy="156" r="109" fill="none" stroke="#991b1b" stroke-opacity="0.2" stroke-width="7" filter="url(#blurSm)"/>
  </g>

  <!-- Soft haze below the moon -->
  <ellipse cx="960" cy="276" rx="190" ry="26" fill="#080808" opacity="0.55" filter="url(#blurSm)"/>

  <!-- Distant birds -->
  <g fill="none" stroke="#52525b" stroke-width="1.4" stroke-linecap="round" opacity="0.65">
    <path d="M782 84 q 6 -6 12 0 q 6 -6 12 0"/>
    <path d="M816 70 q 5 -5 10 0 q 5 -5 10 0"/>
    <path d="M840 96 q 4 -4 8 0 q 4 -4 8 0"/>
  </g>

  <!-- Far mountains -->
  <path d="M0 322 L 64 288 L 132 306 L 208 268 L 286 302 L 360 274 L 444 310 L 522 282 L 604 312 L 690 276 L 768 304 L 846 268 L 930 300 L 1010 276 L 1092 306 L 1164 284 L 1200 296 L 1200 400 L 0 400 Z" fill="#0d0d0d"/>
  <path d="M0 344 L 92 318 L 176 338 L 258 312 L 344 338 L 430 314 L 518 340 L 604 316 L 700 342 L 790 318 L 878 340 L 966 316 L 1054 338 L 1140 318 L 1200 332 L 1200 400 L 0 400 Z" fill="#090909"/>

  <!-- Low mist -->
  <ellipse cx="300" cy="336" rx="380" ry="64" fill="url(#mist)"/>
  <ellipse cx="960" cy="340" rx="420" ry="70" fill="url(#mist)"/>

  <!-- Torii gate -->
  <g>
    <path d="M188 352 L 208 352 L 220 206 L 202 204 Z" fill="#0e0e0e"/>
    <path d="M326 352 L 346 352 L 332 204 L 314 206 Z" fill="#0e0e0e"/>
    <path d="M162 194 Q 267 164 372 194 L 370 210 Q 267 184 164 210 Z" fill="#0e0e0e"/>
    <path d="M184 224 L 350 224 L 347 237 L 187 237 Z" fill="#0e0e0e"/>
    <path d="M258 208 L 292 208 L 290 258 L 260 258 Z" fill="#0e0e0e"/>
    <path d="M240 244 L 310 244 L 308 251 L 242 251 Z" fill="#0e0e0e"/>
    <path d="M162 194 Q 267 164 372 194" fill="none" stroke="#dc2626" stroke-opacity="0.5" stroke-width="1.5"/>
    <path d="M208 210 L 200 350" fill="none" stroke="#991b1b" stroke-opacity="0.28" stroke-width="1"/>
    <path d="M326 210 L 340 350" fill="none" stroke="#991b1b" stroke-opacity="0.2" stroke-width="1"/>
    <rect x="265" y="216" width="20" height="30" fill="#151515"/>
    <circle cx="275" cy="231" r="4" fill="#dc2626" opacity="0.7" filter="url(#blurXs)"/>
    <circle cx="275" cy="231" r="1.5" fill="#fca5a5" opacity="0.8"/>
  </g>

  <!-- Distant pagoda -->
  <g opacity="0.9">
    <path d="M450 344 L 450 330 L 530 330 L 530 344 Z" fill="#0c0c0c"/>
    <path d="M458 330 L 458 306 L 522 306 L 522 330 Z" fill="#0c0c0c"/>
    <path d="M418 306 Q 490 286 562 306 L 558 317 Q 490 299 422 317 Z" fill="#0c0c0c"/>
    <path d="M468 306 L 468 282 L 512 282 L 512 306 Z" fill="#0c0c0c"/>
    <path d="M434 282 Q 490 264 546 282 L 542 292 Q 490 275 438 292 Z" fill="#0c0c0c"/>
    <path d="M476 282 L 476 260 L 504 260 L 504 282 Z" fill="#0c0c0c"/>
    <path d="M448 260 Q 490 245 532 260 L 529 268 Q 490 254 451 268 Z" fill="#0c0c0c"/>
    <path d="M487 260 L 493 260 L 493 278 L 487 278 Z" fill="#0c0c0c"/>
    <path d="M490 245 L 490 225 M 483 232 L 497 232 M 485 238 L 495 238" stroke="#0c0c0c" stroke-width="2.2"/>
    <path d="M562 306 L 558 317 M 546 282 L 542 292 M 532 260 L 529 268" stroke="#991b1b" stroke-opacity="0.3" stroke-width="1.1"/>
    <path d="M522 330 L 522 306 M 512 306 L 512 282" stroke="#991b1b" stroke-opacity="0.18" stroke-width="1"/>
  </g>

  <!-- Samurai backlight -->
  <ellipse cx="756" cy="272" rx="104" ry="128" fill="#991b1b" opacity="0.17" filter="url(#blurLg)"/>

  <!-- Samurai shadow -->
  <ellipse cx="720" cy="356" rx="92" ry="9" fill="#000000" opacity="0.8"/>
  <ellipse cx="716" cy="356" rx="78" ry="6" fill="#dc2626" opacity="0.1" filter="url(#blurSm)"/>

  <!-- Scarf -->
  <path d="M708 228 C 680 234 654 248 630 267 C 616 278 602 285 584 289 C 604 293 626 287 646 277 C 668 266 690 248 714 242 Z" fill="#0a0a0a"/>
  <path d="M584 289 C 608 292 632 284 652 273 C 674 260 694 246 714 242" fill="none" stroke="#991b1b" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Sheathed sword at the left hip -->
  <path d="M690 282 L 648 332" stroke="#0d0d0d" stroke-width="7" stroke-linecap="round"/>
  <path d="M690 282 L 650 330" stroke="#991b1b" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Samurai silhouette -->
  <g>
    <!-- Body and haori coat -->
    <path d="M720 216
             C 706 216 696 224 692 238
             L 684 270
             C 676 298 668 328 660 354
             L 706 354
             L 714 304
             L 722 354
             L 766 354
             C 758 326 750 296 744 270
             L 736 238
             C 732 224 724 216 720 216 Z" fill="#060606" stroke="#151515" stroke-width="0.9"/>
    <path d="M692 238 L 684 270 C 676 298 668 328 660 354" fill="none" stroke="#7f1d1d" stroke-opacity="0.42" stroke-width="1.5"/>
    <path d="M736 238 L 744 270 C 750 296 758 326 766 354" fill="none" stroke="#991b1b" stroke-opacity="0.48" stroke-width="1.6"/>

    <!-- Shoulder mantle -->
    <path d="M692 236 C 698 227 708 223 720 223 C 732 223 742 227 748 236 C 744 245 742 251 740 257 L 730 250 L 720 257 L 710 250 L 700 257 C 698 251 694 245 692 236 Z" fill="#080808" stroke="#1a1a1a" stroke-width="0.8"/>
    <path d="M748 236 C 744 245 742 251 740 257" fill="none" stroke="#991b1b" stroke-opacity="0.5" stroke-width="1.2"/>

    <!-- Coat opening and belt -->
    <path d="M710 238 L 720 262 L 730 238" fill="none" stroke="#1f1f1f" stroke-width="1.6"/>
    <path d="M712 240 L 720 258" fill="none" stroke="#991b1b" stroke-opacity="0.35" stroke-width="1"/>
    <path d="M692 274 L 748 274 L 746 283 L 694 283 Z" fill="#151515"/>
    <rect x="714" y="272" width="12" height="13" fill="#1f1f1f"/>
    <path d="M704 286 L 701 350 M 736 286 L 739 350" stroke="#1a1a1a" stroke-width="1.1"/>

    <!-- Arms -->
    <path d="M696 236 L 674 280 L 677 306" fill="none" stroke="#060606" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M696 238 L 674 280 L 677 306" fill="none" stroke="#7f1d1d" stroke-opacity="0.4" stroke-width="1.1"/>
    <path d="M744 236 L 760 262 L 752 286" fill="none" stroke="#060606" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M744 238 L 760 262 L 752 286" fill="none" stroke="#991b1b" stroke-opacity="0.5" stroke-width="1.2"/>
    <circle cx="677" cy="307" r="5.5" fill="#060606"/>
    <circle cx="752" cy="287" r="5.5" fill="#060606"/>

    <!-- Head -->
    <path d="M713 203 L 727 203 L 728 224 L 712 224 Z" fill="#060606" stroke="#141414" stroke-width="0.8"/>
    <circle cx="720" cy="218" r="11.5" fill="#060606" stroke="#141414" stroke-width="0.8"/>
    <path d="M725 218 L 731 218" stroke="#dc2626" stroke-opacity="0.85" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Kasa hat -->
    <path d="M720 169 C 730 172 740 181 747 190 L 778 202 C 754 211 736 214 720 214 C 704 214 686 211 662 202 L 693 190 C 700 181 710 172 720 169 Z" fill="#050505" stroke="#141414" stroke-width="0.9"/>
    <path d="M662 202 C 686 211 704 214 720 214 C 736 214 754 211 778 202" fill="none" stroke="#1f1f1f" stroke-width="1.2"/>
    <path d="M720 170 L 778 202" fill="none" stroke="#dc2626" stroke-opacity="0.5" stroke-width="1.6"/>
    <path d="M720 170 C 710 172 700 181 693 190 L 662 202" fill="none" stroke="#7f1d1d" stroke-opacity="0.3" stroke-width="1.2"/>

    <!-- Katana -->
    <path d="M748 282 L 768 300" stroke="#181818" stroke-width="6.5" stroke-linecap="round"/>
    <path d="M748 282 L 768 300" stroke="#991b1b" stroke-opacity="0.45" stroke-width="1"/>
    <circle cx="768" cy="300" r="4.8" fill="#0a0a0a" stroke="#991b1b" stroke-opacity="0.6"/>
    <path d="M768 300 L 826 358" stroke="#1f1f1f" stroke-width="4.4" stroke-linecap="round"/>
    <path d="M769 300 L 824 356" stroke="#52525b" stroke-opacity="0.55" stroke-width="0.8"/>
    <path d="M769 300 L 824 356" stroke="#dc2626" stroke-opacity="0.5" stroke-width="0.9"/>
  </g>

  <!-- Foreground ridge -->
  <path d="M0 356 C 118 344 196 350 286 358 C 386 367 474 340 570 352 C 660 363 734 344 828 352 C 922 360 1008 344 1100 354 C 1150 359 1180 356 1200 354 L 1200 400 L 0 400 Z" fill="#030303"/>
  <path d="M0 356 C 118 344 196 350 286 358 C 386 367 474 340 570 352 C 660 363 734 344 828 352 C 922 360 1008 344 1100 354 C 1150 359 1180 356 1200 354" fill="none" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Grass silhouettes -->
  <g stroke="#0a0a0a" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M452 362 q -4 -14 3 -24 M456 362 q 3 -12 9 -18 M460 362 q 6 -9 14 -12"/>
    <path d="M852 360 q -5 -16 2 -27 M856 360 q 4 -13 11 -20 M860 360 q 7 -10 15 -14"/>
    <path d="M1062 358 q -4 -12 3 -22 M1066 358 q 4 -11 9 -17"/>
    <path d="M154 360 q -4 -11 2 -19 M158 360 q 4 -10 9 -15"/>
    <path d="M604 360 q -4 -11 2 -19 M608 360 q 4 -10 9 -15"/>
  </g>

  <!-- Sakura petals -->
  <g>
    <g transform="translate(1066,26)"><g class="petal p1"><path d="M0 0 C 4 -5 10 -2 10 3 C 10 9 3 12 -3 9 C -8 6 -5 2 0 0 Z" fill="#f87171" opacity="0.7" transform="scale(1.1)"/></g></g>
    <g transform="translate(812,52)"><g class="petal p2"><path d="M0 0 C 4 -5 10 -2 10 3 C 10 9 3 12 -3 9 C -8 6 -5 2 0 0 Z" fill="#f87171" opacity="0.62" transform="scale(0.85)"/></g></g>
    <g transform="translate(514,34)"><g class="petal p3"><path d="M0 0 C 4 -5 10 -2 10 3 C 10 9 3 12 -3 9 C -8 6 -5 2 0 0 Z" fill="#dc2626" opacity="0.75" transform="scale(1.1)"/></g></g>
    <g transform="translate(1008,112)"><g class="petal p4"><path d="M0 0 C 4 -5 10 -2 10 3 C 10 9 3 12 -3 9 C -8 6 -5 2 0 0 Z" fill="#fca5a5" opacity="0.5" transform="scale(0.7)"/></g></g>
    <g transform="translate(348,132)"><g class="petal p5"><path d="M0 0 C 4 -5 10 -2 10 3 C 10 9 3 12 -3 9 C -8 6 -5 2 0 0 Z" fill="#dc2626" opacity="0.55" transform="scale(0.85)"/></g></g>
    <g transform="translate(1148,174)"><g class="petal p6"><path d="M0 0 C 4 -5 10 -2 10 3 C 10 9 3 12 -3 9 C -8 6 -5 2 0 0 Z" fill="#f87171" opacity="0.5" transform="scale(0.6)"/></g></g>
