    <g transform="translate(900,246)"><g class="petal p8"><path d="M0 0 C 4 -5 10 -2 10 3 C 10 9 3 12 -3 9 C -8 6 -5 2 0 0 Z" fill="#f87171" opacity="0.45" transform="scale(0.55)"/></g></g>
  </g>

  <!-- Embers -->
  <g fill="#ef4444">
    <circle class="ember" cx="238" cy="344" r="2" opacity="0.45"/>
    <circle class="ember e2" cx="404" cy="352" r="1.5" opacity="0.4"/>
    <circle class="ember e3" cx="800" cy="352" r="2.2" opacity="0.45"/>
    <circle class="ember e4" cx="900" cy="346" r="1.4" opacity="0.35"/>
    <circle class="ember e5" cx="1086" cy="350" r="1.8" opacity="0.4"/>
    <circle class="ember e6" cx="560" cy="354" r="1.3" opacity="0.35"/>
