  <!-- Vignette and frame -->
  <rect width="1200" height="400" fill="url(#vignette)"/>
  <rect x="14.5" y="14.5" width="1171" height="371" rx="6" fill="none" stroke="#1f1f1f"/>
  <g stroke="#dc2626" stroke-opacity="0.7" stroke-width="2">
    <path d="M15 52 L 15 15 L 52 15"/>
    <path d="M1148 15 L 1185 15 L 1185 52"/>
    <path d="M15 348 L 15 385 L 52 385"/>
    <path d="M1148 385 L 1185 385 L 1185 348"/>
  </g>
  <line x1="420" y1="15" x2="780" y2="15" stroke="url(#lineFade)" stroke-width="1"/>

  <!-- Decorative kanji -->
  <text x="64" y="118" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#dc2626" opacity="0.16">侍</text>
  <line x1="82" y1="132" x2="82" y2="182" stroke="#dc2626" stroke-opacity="0.22" stroke-width="1"/>
</svg>
