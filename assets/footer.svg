<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="112" viewBox="0 0 1200 112" role="img" aria-labelledby="title desc">
  <title id="title">Footer</title>
  <desc id="desc">A dark footer with a small pulsing crimson sun and the words Thanks for visiting.</desc>

  <defs>
    <linearGradient id="topLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#dc2626" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dc2626" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style><![CDATA[
      .sun { animation: breathe 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .ember { animation: drift 11s ease-out infinite; }
      .e2 { animation-delay: -4s; animation-duration: 14s; }
      .e3 { animation-delay: -8s; animation-duration: 12s; }
      @keyframes breathe {
        0%, 100% { opacity: 0.55; transform: scale(0.92); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @keyframes drift {
        0% { transform: translate(0, 0); opacity: 0; }
        20% { opacity: 0.5; }
        100% { transform: translate(-22px, -46px); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sun, .ember { animation: none; }
      }
    ]]></style>
  </defs>

  <rect width="1200" height="112" fill="#080808"/>
  <line x1="0" y1="0.5" x2="1200" y2="0.5" stroke="url(#topLine)"/>
  <ellipse cx="600" cy="34" rx="90" ry="30" fill="url(#sunGlow)"/>
  <circle class="sun" cx="600" cy="34" r="10" fill="#dc2626" filter="url(#soft)"/>
  <circle class="sun" cx="600" cy="34" r="7" fill="#dc2626"/>
  <circle cx="600" cy="34" r="3" fill="#fca5a5" opacity="0.55"/>

  <text x="600" y="72" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="5" fill="#d4d4d4">THANKS FOR VISITING</text>
  <text x="600" y="92" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="10" letter-spacing="3" fill="#71717a">YASSINE AOUAJ</text>
  <line x1="492" y1="82" x2="552" y2="82" stroke="#991b1b" stroke-opacity="0.55"/>
  <line x1="648" y1="82" x2="708" y2="82" stroke="#991b1b" stroke-opacity="0.55"/>

  <g fill="#dc2626">
    <circle class="ember" cx="520" cy="96" r="1.5" opacity="0.4"/>
    <circle class="ember e2" cx="690" cy="100" r="1.2" opacity="0.35"/>
    <circle class="ember e3" cx="820" cy="94" r="1.3" opacity="0.3"/>
  </g>
</svg>
